<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Home · BoxBrain AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body class="">
    <main class="page">
      <header class="top rise">
        <!-- <div class="left"><button class="menu-btn" id="menuBtn" type="button" aria-label="Open chat history" aria-expanded="false" aria-controls="sidebar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button> -->
        <a class="logo" href="{% url 'index' %}">
          <svg viewBox="0 0 48 48">
            <polygon points="24,3 44,14 24,25 4,14" fill="#ff9a52" />
            <polygon points="4,14 24,25 24,47 4,36" fill="#ff6a00" />
            <polygon points="44,14 24,25 24,47 44,36" fill="#e85d00" />
          </svg>
          <span>Box<b>Brain</b></span>
        </a>
        </div>

        <div class="acts">
          <div class="left"><button class="menu-btn" id="menuBtn" type="button" aria-label="Open chat history" aria-expanded="false" aria-controls="sidebar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg><span>Chats</span></button>
          <a class="avatar" href="{% url 'profile' %}" aria-label="Profile">R</a>
        </div>
      </header>

      <section class="hero">
        <div class="copy">
          <span class="badge rise" style="--d: 0.05s">
            <svg
              class=""
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"
                fill="currentColor"
              />
            </svg>
            AI Chat Assistant
          </span>

          <h1 class="rise" style="--d: 0.12s">Hi, I’m <span>BoxBrain</span></h1>
        </div>

        <div class="stage rise" style="--d: 0.15s">
          <img
            class="robot"
            src="{% static 'images/robot.png' %}"
            alt="BoxBrain robot assistant"
          />

          <div class="fc f1">
            <i>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"
                />
              </svg>
            </i>
            Get ideas
          </div>

          <div class="fc f2">
            <i>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
              </svg>
            </i>
            <b>Explain code</b>
          </div>

          <div class="fc f3">
            <i>
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"
                />
                <path d="M14 3v5h5M9 13h6M9 17h6" />
              </svg>
            </i>
            <b>Summarize<br />this text</b>
          </div>
        </div>
      </section>

      <form method="POST">
        <section class="composer rise" style="--d: 0.4s">
          <textarea
            id="msg"
            rows="1"
            placeholder="How I can help you today?"
            required
          ></textarea>

          <div class="crow">
            <button type="button" class="rb" aria-label="Add">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>

            <button type="button" class="rb" aria-label="Attach">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"
                />
              </svg>
            </button>

            <button type="button" class="rb" aria-label="Web search">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
              </svg>
            </button>

            <span class="sp"></span>

            <button type="button" class="rb" aria-label="Voice">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
            </button>

            <button type="submit" class="send" id="send" aria-label="Send">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 3L3 10l7 3 3 7z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </section>

        <section class="quick rise" style="--d: 0.5s">
          <button type="button" class="qc" data-p="Summarize this text">
            <i style="background: #eceafd; color: #5b5bd6">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"
                />
                <path d="M14 3v5h5M9 13h6M9 17h6" />
              </svg>
            </i>
            <span>Summarize<br />this text</span>
          </button>

          <button type="button" class="qc" data-p="Explain this code">
            <i style="background: #dcf8ea; color: #16a870">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
              </svg>
            </i>
            <span>Explain<br /> this code</span>
          </button>

          <button type="button" class="qc" data-p="Give me some ideas">
            <i style="background: #fde8ec; color: #e5334d">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"
                />
              </svg>
            </i>
            <span>Give me<br />some ideas</span>
          </button>

          <button type="button" class="qc" data-p="Help me learn something">
            <i style="background: #e0f0ff; color: #1d8cf8">
              <svg
                class=""
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 9l10-5 10 5-10 5z" fill="currentColor" />
                <path d="M6 11v5c3 3 9 3 12 0M22 9v6" />
              </svg>
            </i>
            <span>Help me<br />learn something</span>
          </button>
        </section>
      </form>
    </main>

    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar" aria-label="Chat history" inert>
      <div class="s-head"><span class="s-title">Your chats</span><button class="s-close" id="menuClose" type="button" aria-label="Close chat history"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="s-new"><button class="btn-new" id="newChat" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button></div>
      <nav class="s-list"><p class="s-label">Today</p><button class="s-item active" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Explain React useEffect</span></button><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Summarize meeting notes</span></button><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Ideas for a startup name</span></button><p class="s-label">Yesterday</p><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Python list comprehension help</span></button><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Plan a 3-day Goa trip</span></button><p class="s-label">Previous 7 days</p><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Write a cover letter</span></button><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Learn SQL joins</span></button><button class="s-item" type="button"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>Fix CSS grid overflow</span></button></nav>
      <a class="s-foot" href="{% url 'profile' %}"><span class="avatar">R</span><span><b>Riya Sharma</b><small>Free plan</small></span></a>
    </aside>

    <div class="toast" id="toast"></div>

    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
